<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Hermes — Word</title>
    <link rel="stylesheet" href="assets/design-system.css" />
  </head>

  <body class="theme-word">
    <div id="app" class="ds-app">
      <header id="header" class="ds-header">
        <div class="ds-brand">
          <span class="mark">H</span>
          <span>Hermes</span>
        </div>
        <div class="ds-actions">
          <button
            id="newchat"
            class="ds-icon-btn"
            type="button"
            title="Cuộc hội thoại mới"
            aria-label="New chat"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Dedicated status bar — dot + text on its own row so the header
           stays brand-only. Tone is mirrored onto the row by taskpane.js. -->
      <div id="statusRow" class="ds-status-row">
        <span class="dot" aria-hidden="true"></span>
        <span id="status" class="ds-status" role="status" aria-live="polite">Sẵn sàng</span>
      </div>

      <!-- Context chips (Pinned / Snapshot / warnings) render here instead
           of inside the header — see refreshContextBar() in taskpane.js. -->
      <div id="contextRow"></div>

      <main class="ds-content">
        <!-- Empty state — shown until the first message lands. The taskpane
             JS hides it via .is-hidden; it is the composed first impression
             instead of a blank pane. -->
        <div id="empty" class="ds-empty">
          <div class="ds-empty-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </div>
          <p class="ds-empty-title">Sửa văn bản cùng Hermes</p>
          <p class="ds-empty-body">
            Chọn một đoạn trong tài liệu rồi yêu cầu viết lại, hoặc để trống
            vùng chọn để kiểm tra chính tả toàn văn bản.
          </p>
          <ul class="ds-empty-hint">
            <li>Chọn đoạn văn → yêu cầu viết lại</li>
            <li>Chọn bảng → chỉnh sửa từng ô</li>
            <li>Không chọn gì → soát lỗi chính tả cả bài</li>
          </ul>
        </div>

        <div id="log" class="ds-log" role="log" aria-live="polite"></div>

        <div
          id="preview"
          class="ds-preview"
          role="region"
          aria-label="Proposed changes"
        ></div>

        <!-- Visibility is driven purely by the `hidden` attribute from
             taskpane.js. Do NOT re-add data-show="false": the CSS rule for it
             outranks .ds-toggle-row's display:flex, so the toggle stayed
             invisible even after JS cleared `hidden`. -->
        <label id="markRedWrap" class="ds-toggle-row" hidden>
          <input type="checkbox" id="markRed" checked />
          <span>Đánh dấu đỏ phần đã sửa</span>
        </label>

        <button
          id="apply"
          class="ds-btn ds-btn-primary ds-apply"
          type="button"
          hidden
        >
          Áp dụng thay đổi
        </button>
      </main>

      <div id="composer" class="ds-foot">
        <textarea
          id="prompt"
          class="ds-input"
          rows="1"
          placeholder="Hỏi tôi sửa đoạn văn bản đã chọn…"
        ></textarea>
        <button id="ask" class="ds-send" type="button" aria-label="Gửi">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M22 2 11 13" />
            <path d="M22 2 15 22l-4-9-9-4 20-7Z" />
          </svg>
          <span class="ds-sr">Gửi</span>
        </button>
      </div>
    </div>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </body>
</html>
