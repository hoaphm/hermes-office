<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Hermes — Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="assets/design-system.css" />
  </head>

  <body class="theme-word">
    <div id="app" class="ds-app">
      <header id="header" class="ds-header">
        <div class="ds-brand">
          <span class="mark">H</span>
          <span>Hermes</span>
        </div>
        <div class="ds-actions">
          <!-- Tests the two hops separately (see CONTEXT.md) so a broken call
               can be located without provoking one with a real question. -->
          <button
            id="hopcheck"
            class="ds-icon-btn"
            type="button"
            title="Kiểm tra kết nối"
            aria-label="Kiểm tra kết nối"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12h4l2.5 7 5-14 2.5 7h4" />
            </svg>
          </button>
          <button
            id="newchat"
            class="ds-icon-btn"
            type="button"
            title="Cuộc hội thoại mới"
            aria-label="New chat"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Dedicated status bar — dot + text on its own row so the header
           stays brand-only. Tone is mirrored onto the row by taskpane.js. -->
      <div id="statusRow" class="ds-status-row">
        <span class="dot" aria-hidden="true"></span>
        <span id="status" class="ds-status" role="status" aria-live="polite">Sẵn sàng</span>
      </div>

      <!-- Context chips (Pinned / Snapshot / warnings) render here instead
           of inside the header — see refreshContextBar() in taskpane.js. -->
      <div id="contextRow"></div>

      <main class="ds-content">
        <!-- Empty state — shown until the first message lands. The taskpane
             JS hides it via .is-hidden; it is the composed first impression
             instead of a blank pane. -->
        <div id="empty" class="ds-empty">
          <div class="ds-empty-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </div>
          <span class="ds-eyebrow">Word</span>
          <p class="ds-empty-title">Sửa văn bản cùng Hermes</p>
          <p class="ds-empty-body">
            Chọn một đoạn trong tài liệu rồi yêu cầu viết lại, hoặc để trống
            vùng chọn để kiểm tra chính tả toàn văn bản.
          </p>
          <ul class="ds-empty-hint">
            <li>Chọn đoạn văn → yêu cầu viết lại</li>
            <li>Chọn bảng → chỉnh sửa từng ô</li>
            <li>Không chọn gì → soát lỗi chính tả cả bài</li>
          </ul>
        </div>

        <div id="log" class="ds-log" role="log" aria-live="polite"></div>

        <div
          id="preview"
          class="ds-preview"
          role="region"
          aria-label="Proposed changes"
        ></div>

        <label id="markRedWrap" class="ds-toggle-row" data-show="false" hidden>
          <input type="checkbox" id="markRed" checked />
          <span>Đánh dấu đỏ phần đã sửa</span>
        </label>

        <button
          id="apply"
          class="ds-btn ds-btn-primary ds-apply"
          type="button"
          hidden
        >
          <span>Áp dụng thay đổi</span>
          <span class="ds-cta-disc" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
          </span>
        </button>
      </main>

      <div id="composer" class="ds-foot">
        <div class="ds-composer-shell">
          <textarea
            id="prompt"
            class="ds-input"
            rows="1"
            placeholder="Hỏi tôi sửa đoạn văn bản đã chọn…"
          ></textarea>
          <button id="ask" class="ds-send" type="button" aria-label="Gửi">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M22 2 11 13" />
              <path d="M22 2 15 22l-4-9-9-4 20-7Z" />
            </svg>
            <span class="ds-sr">Gửi</span>
          </button>
        </div>
      </div>
    </div>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </body>
</html>
